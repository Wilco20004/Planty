services:
  planty:
    build: .
    image: planty:latest
    container_name: planty
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - PORT=8080

  # Browser-based slicer for the Flashforge Adventurer 5M (static site, ~10 MB image).
  # Start only this service with: docker compose up -d planty-slicer
  planty-slicer:
    build: ./slicer
    image: planty-slicer:latest
    container_name: planty-slicer
    restart: unless-stopped
    ports:
      - "8081:8099"
