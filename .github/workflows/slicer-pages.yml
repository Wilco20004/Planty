# Deploys the browser-based slicer (slicer/) to GitHub Pages.
# Enable Pages for this repository (Settings → Pages → Source: GitHub Actions) to use it.
name: Deploy slicer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'slicer/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/slicer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --workspace slicer --include-workspace-root
      - run: npm run test --workspace slicer
      - run: npm run build --workspace slicer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slicer/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
